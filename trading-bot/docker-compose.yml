version: '3.8'

services:
  trading-bot:
    build: .
    container_name: mnq-trading-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NT_HOST=${NT_HOST:-host.docker.internal}
      - NT_PORT=${NT_PORT:-36973}
      - NT_ACCOUNT=${NT_ACCOUNT:-Sim101}
      - INSTRUMENT=${INSTRUMENT:-MNQ 03-24}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-10000}
      - STRATEGY_NAME=${STRATEGY_NAME:-MA_Crossover}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-3}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-500}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./logs:/app/logs
      - ./results:/app/results
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - redis
    networks:
      - trading-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-network

  prometheus:
    image: prom/prometheus:latest
    container_name: trading-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - trading-network

  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - trading-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  trading-network:
    driver: bridge
